# https://linux.die.net/man/5/avahi-daemon.conf

[server]
# Enforce no other avahi on the same ip
disallow-other-stacks=yes
# Network
use-ipv4=yes
use-ipv6=yes
# Dbus
enable-dbus=yes
# Rate limiting
ratelimit-interval-usec=1000000
ratelimit-burst=1000
# Domain
domain-name=local
browse-domains=local

[wide-area]
enable-wide-area=no

[publish]
# Cups needs publishing
disable-publishing=no
# Be slick
publish-hinfo=no
publish-workstation=yes
# Publish ipv4 address over ipv6
publish-a-on-ipv6=no
# And conversely
publish-aaaa-on-ipv4=no

[reflector]
enable-reflector=no

[rlimits]
rlimit-core=0
rlimit-data=4194304
rlimit-fsize=0
rlimit-nofile=300
rlimit-stack=4194304
# Remove this, according to https://github.com/lxc/lxc/issues/25
# rlimit-nproc = 3
