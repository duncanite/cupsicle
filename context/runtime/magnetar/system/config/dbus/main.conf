<?xml version="1.0" encoding="utf-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
  "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>

  <type>system</type>
  <auth>EXTERNAL</auth>
  <keep_umask/>

  <listen>unix:path=/magnetar/runtime/dbus/system_bus_socket</listen>

  <!-- Avahi daemon needs to own its service name -->
  <policy user="avahi">
    <allow own="org.freedesktop.Avahi"/>
    <allow send_destination="org.freedesktop.Avahi"/>
    <allow send_interface="org.freedesktop.Avahi.*"/>
  </policy>

  <!-- CUPS needs to communicate with Avahi for mDNS announcements -->
  <policy user="cups">
    <allow send_destination="org.freedesktop.Avahi"/>
    <allow send_interface="org.freedesktop.Avahi.Server"/>
    <allow send_interface="org.freedesktop.Avahi.EntryGroup"/>
  </policy>

  <!-- Default policy - minimal necessary permissions -->
  <policy context="default">
    <!-- Basic DBus introspection -->
    <allow send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_interface="org.freedesktop.DBus.Peer"/>

    <!-- Can query Avahi services (read-only) -->
    <allow send_destination="org.freedesktop.Avahi"/>

    <!-- Deny everything else -->
    <deny send_destination="*"/>
    <deny own="*"/>
    <deny send_type="method_call"/>
  </policy>

</busconfig>
