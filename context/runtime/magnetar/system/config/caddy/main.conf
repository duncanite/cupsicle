{
	# Ports
	https_port 443
	http_port 80

	# Admin off!
	admin off

	# Disable HTTP->HTTPS redirects but keep automatic certificate management
	# Without port 80 bound, Caddy will use TLS-ALPN-01 challenge on port 443
	auto_https disable_redirects

	# Default SNI to main domain
	default_sni {{.Domain}}
	# No point in trying to insert into host store, useful when tls mode is internal
	skip_install_trust
	# Default storage location for certs is XDG_DATA_HOME

	# Order directives, important when plugins are enabled
	# order basicauth after request_header
	# order replace after encode
	# order cache before rewrite

	# Control TLS behavior
	auto_https disable_redirects

	log {
		output stdout
		format json
		level {{.LogLevel}}
	}

	# Enable metrics and basic dos protection
	metrics
	#  servers {
	#	max_header_size 16KB
	#  }
}

# Healthcheck: bind to localhost only
http://127.0.0.1 {
	reverse_proxy http://127.0.0.1:{{.CUPSWebPort}}
}

# MUST be bound to internal network, as this is unprotected
{{.MetricsURL}} {
	metrics
}

https://{{.Domain}} {
	log {
		output stdout
		format json
		level {{.LogLevel}}
	}

	header {
		# Signature
		Server "{{.ServerName}}"

		# Prevent clickjacking
		?X-Frame-Options DENY

		# XSS protection
		?X-Content-Type-Options nosniff

		# XSS protection (legacy but defense in depth)
		?X-XSS-Protection "1; mode=block"

		# Strict transport security (HTTPS only)
		?Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"

		# keep referrer data off of HTTP connections
		# Referrer-Policy no-referrer-when-downgrade
		# Referrer-Policy "same-origin"
		?Referrer-Policy "strict-origin-when-cross-origin"

		# CSP
		# Content Security Policy (adjust as needed)
		# FIXME: move to prod once figured out what is working and what is not
		?Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; report-uri /csp-report"
	}

	tls internal {
		protocols "tls1.3"
		# FIXME: enable mTLS
		# client_auth {
		#   mode {$CDY_MTLS_MODE}
		#   trusted_ca_cert_file {$CDY_MTLS_TRUST}
		# }
	}

	# Authentication, enable if necessary
	# basicauth bcrypt "$CDY_AUTH_REALM" {
	#   "$CDY_AUTH_USERNAME" "{$CDY_AUTH_PASSWORD}"
	# }

	handle /csp-report {
		# Should alert
		respond 204
	}

	# CUPS backend
	handle {
		reverse_proxy https://127.0.0.1:{{.CUPSWebPort}} {
			# Cert is self-signed...
			transport http {
				tls_insecure_skip_verify
			}
			# Sets the host header / x-host appropriately
			header_up Host {upstream_hostport}
			header_up +X-Forwarded-Host {host}
			# Older implementations may still require this - note this a possible downstream proxy ip address
			header_up X-Real-IP {remote_ip}
			# Remove dupe entry (when set by the backend)
			header_down -Server
			# This rewrite locations from the backend in case the backend is braindead and does not honor the host or scheme
			header_down Location ^https?://127\.0\.0\.1(:[0-9]+)?(/.*)?$ https://{{.Domain}}$2
			header_down Location ^http://{{.Domain}}(/.*)?$ https://{{.Domain}}$2
		}
	}
}
