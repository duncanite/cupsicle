{
  # Allow controlling ports
	https_port {$CDY_PORT_HTTPS}
	http_port {$CDY_PORT_HTTP}

	# Admin off!
	admin off

	# Default SNI to main domain
	default_sni {$CDY_DOMAIN}
	# No point in trying to insert into host store, useful when tls mode is internal
	skip_install_trust
	# Default storage location for certs is XDG_DATA_HOME

  # Order directives, important when plugins are enabled
  # order basicauth after request_header
  # order replace after encode
  # order cache before rewrite

  # Control TLS behavior
	auto_https {$CDY_TLS_AUTO}
  acme_ca {$CDY_ACME_CA}

  log {
    output stdout
    format json
    level {$CDY_LOG_LEVEL}
  }

# cache needs adjustments - preserved for future rework
#   cache {
#     log_level warn
#
#     cache_keys {
#       disable_body
#     }
#
#     key {
#       disable_body
#     }
#
#     stale 31536000s
#     ttl 31536000s
#
#     nuts {
#       configuration {
#         Dir "{$XDG_CACHE_HOME}/caddy"
#         EntryIdxMode 1
#         RWMode 0
#         SegmentSize 1024
#         NodeNum 42
#         SyncEnable true
#         StartFileLoadingMode 1
#       }
#     }
#   }

  # Enable metrics and basic dos protection
  metrics
  servers {
    max_header_size 16KB
  }
}

# Bind to localhost
http://127.0.0.1 {
	reverse_proxy http://127.0.0.1:{$_SERVICE_PORT}
}

# MUST be bound to internal network, as this is unprotected
{$CDY_METRICS_URL} {
  metrics
}

https://{$CDY_DOMAIN} {$CDY_ADDITIONAL_DOMAINS} {
  log {
    output stdout
    format json
    level {$CDY_LOG_LEVEL}
  }

  header {
    # Signature
    Server "{$CDY_SERVER_NAME}"

		# Prevent clickjacking
    ?X-Frame-Options DENY

		# XSS protection
    ?X-Content-Type-Options nosniff

		# XSS protection (legacy but defense in depth)
		?X-XSS-Protection "1; mode=block"

		# Strict transport security (HTTPS only)
		?Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"

    # keep referrer data off of HTTP connections
    # Referrer-Policy no-referrer-when-downgrade
    # Referrer-Policy "same-origin"
    ?Referrer-Policy "strict-origin-when-cross-origin"

    # CSP
		# Content Security Policy (adjust as needed)
		?Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; report-uri /csp-report"
  }

  tls {$CDY_TLS_MODE} {
    protocols "tls{$CDY_TLS_MIN}"
    # client_auth {
    #   mode {$CDY_MTLS_MODE}
    #   trusted_ca_cert_file {$CDY_MTLS_TRUST}
    # }
  }

  # Authentication, enable if necessary
  # basicauth bcrypt "$CDY_AUTH_REALM" {
  #   "$CDY_AUTH_USERNAME" "{$CDY_AUTH_PASSWORD}"
  # }

  handle /csp-report {
    # Log and discard, or save to file, or forward somewhere
    respond 204
  }

  # CUPS backend
  reverse_proxy http://127.0.0.1:631 {
    # Sets the host header / x-host appropriately
    # XXX not completely clear yet if this is cumulative or not (eg: downstream proxies may have set that already, so, is it preserved)
    header_up Host {upstream_hostport}
    header_up +X-Forwarded-Host {host}
    # Older implementations may still require this - note this a possible downstream proxy ip address
    header_up X-Real-IP {remote_ip}
    # Remove dupe entry (when set by the backend)
    header_down -Server
    # This rewrite locations from the backend that include full domain names to our current host
    header_down Location ^https?://127\.0\.0\.1(:[0-9]+)?(/.*)?$ https://{$CDY_DOMAIN}$2
  }
}
